<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="container nav-inner">
    <a routerLink="/" class="brand">
      <span class="brand-icon">🌾</span>
      <div class="brand-text">
        <span class="brand-title">Biomas</span>
        <span class="brand-sub">Museu Virtual</span>
      </div>
    </a>

    <ul class="nav-links">
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: !!item['exact']}"
             class="nav-link">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <a routerLink="/quiz" class="btn btn-gold quiz-cta">
      🎮 Jogar Quiz
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" [class.open]="menuOpen()">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="mobile-menu" [class.open]="menuOpen()">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" class="mobile-link" (click)="menuOpen.set(false)">
        {{ item.label }}
      </a>
    }
  </div>
</nav>
